name: Build Windows artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install pinned Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r packaging/requirements-build.txt

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and verify application and installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          .\scripts\build_release.ps1 -Python (Get-Command python).Source -Iscc $iscc

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@v6
        with:
          name: Physalix-${{ github.sha }}-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/Physalix-Setup-*.exe
            artifacts/Physalix-Setup-*.exe.sha256
            artifacts/update.json
            artifacts/bundle-manifest.json
            artifacts/third-party-inventory.json
            artifacts/distribution-check.json
            artifacts/normal-launch-check.json
            artifacts/release-tests.log
            artifacts/release-build.log
            artifacts/release-installer.log
